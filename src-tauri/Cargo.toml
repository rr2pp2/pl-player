[package]
name = "pl-player"
version = "3.1.1"
description = "PL Player - local music player"
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "pl_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-dialog = "=2.8.1"
symphonia = { version = "=0.6.1", features = ["all"] }
symphonia-adapter-libopus = "=0.3.0"
cpal = "=0.18.2"
rubato = "=5.0.1"
rtrb = "=0.4.0"
crossbeam-channel = "=0.5.17"
lofty = "=0.25.4"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
serde = { version = "=1.0.229", features = ["derive"] }
# raw_value：歌詞の取得（v3.1.0）で、応答の欄を1つずつ読むため（tauri がすでに有効にしている機能。新しいクレートは無い）
serde_json = { version = "=1.0.151", features = ["raw_value"] }
thiserror = "=2.0.21"
walkdir = "=2.5.0"
tracing = "=0.1.44"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Foundation",
  "Media",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Devices_FunctionDiscovery",
  # v3.1.0：歌詞をネットから取る（通信は WinHTTP だけ）と、名前の照合の NFKC（NormalizeString）
  "Win32_Networking",
  "Win32_Networking_WinHttp",
  "Win32_Globalization",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 2
