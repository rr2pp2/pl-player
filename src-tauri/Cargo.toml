[package]
name = "pl-player"
version = "3.12.0"
description = "PL Player - local music player"
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "pl_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# v3.3.0：テスト用の部品（ごみ箱へ移したテストのファイルを、ごみ箱からも消す処理）を、外のテスト（tests\device_playback.rs）に見せる。
# 配布用のビルド（npm run release）は付けないので、配布物には入らない。新しいクレートは無い
test-support = []

[[test]]
name = "device_playback"
required-features = ["test-support"]

# 同時再生を作る前の、作者の実機での計測（tests\sync_probe.rs。計測そのものは #[ignore]）
[[test]]
name = "sync_probe"
required-features = ["test-support"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-dialog = "=2.8.1"
symphonia = { version = "=0.6.1", features = ["all"] }
symphonia-adapter-libopus = "=0.3.0"
cpal = "=0.18.2"
rubato = "=5.0.1"
rtrb = "=0.4.0"
crossbeam-channel = "=0.5.17"
lofty = "=0.25.4"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
serde = { version = "=1.0.229", features = ["derive"] }
# raw_value：歌詞の取得（v3.1.0）で、応答の欄を1つずつ読むため（tauri がすでに有効にしている機能。新しいクレートは無い）
serde_json = { version = "=1.0.151", features = ["raw_value"] }
thiserror = "=2.0.21"
walkdir = "=2.5.0"
# v3.2.0：着せ替えの zip（人が圧縮したもの）を戻す。画像の部品（png 0.18.1）の下に既にある版を名指しする（新しいクレートは無い。docs\依存の候補.md）
miniz_oxide = "=0.8.9"
tracing = "=0.1.44"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Foundation",
  "Media",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Devices_FunctionDiscovery",
  # v3.1.0：歌詞をネットから取る（通信は WinHTTP だけ）と、名前の照合の NFKC（NormalizeString）
  "Win32_Networking",
  "Win32_Networking_WinHttp",
  "Win32_Globalization",
  # v3.1.2：Symphonia が読めない AAC（HE-AAC）を Media Foundation で鳴らす（新しいクレートは無い）。古い文字コードのタグは Win32_Globalization の MultiByteToWideChar
  "Win32_Media_MediaFoundation",
  # v3.1.2：Media Foundation の DLL があるかを、使う前に確かめる（LoadLibraryExW。DLL は build.rs で遅延読み込みにしている）
  "Win32_System_LibraryLoader",
  # 同時再生の計測（tests\sync_probe.rs）：QueryPerformanceCounter。cpal 0.18.2 がすでに有効にしている機能を明記する（新しいクレートは無い）
  "Win32_System_Performance",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 2
